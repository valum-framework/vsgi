name: CI

on: [pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2

      - name: Update APT cache
        run: sudo apt-get update --quiet

      - name: Install dependencies
        run: sudo apt-get install --yes valac libglib2.0-bin libglib2.0-dev libsoup2.4-dev libfcgi-dev valgrind ninja-build meson

      - name: Build
        run: |
          mkdir build
          meson . build
          ninja -C build -v

      - name: Test
        run: |
          meson test -C build --wrapper valgrind --print-errorlogs --num-processes=1 -v
          DESTDIR=$(mktemp -d) ninja -C build -v install

